policies:
- description: 实训期间使用量潮课堂邮箱统一管理，与招聘邮箱分离；招聘渠道保留但重要程度逐步让位于课堂。
  name: 实训与招聘分离管理原则
  source: 1. 实训可以用量潮课堂这个邮箱去统一管理，然后跟招聘分开。2. 我们还是需要时不时的去补充一些骨干，然后还是要保留一个招聘的渠道，但是它就是重要程度逐渐要让位给我们课堂这块。
- description: 对标浙理工的课程体系，按照秘书处的要求，招聘分为两个等级。
  name: 招聘分级原则
  source: 对标浙理工的课程体系，按照秘书处的要求，招聘会分两个等级。
- description: 使用结构化的开放性访谈式问卷，前置调研候选人责任心等能力，作为初步契约和后续考核依据。
  name: 招聘调研问卷前置原则
  source: 这篇调研问卷侧重于考察我们关心的责任心等能力。……同时也是一份初步契约，在后续考核和正式录用的时候可以继续确认。以一次离职事件为主要教训深入分析，我们得到了关于如何前置识别的关键教训。
- description: 招聘公告可在晚上准备，早上8点定时发布以获取更多曝光。
  name: 招聘公告发布定时原则
  source: 我今天晚上出 招聘明天8:00定时发 然后小红书的我也准备着。
- description: 当招聘量增加时，使用批量邮件统一沟通，提高效率。
  name: 批量邮件处理原则
  source: 因为我感觉招聘量开始上来了，批量直接发一封邮件会比较省事，这样就不用挑岗位了，比之前批量化还简单。
- description: 将课堂与招聘整合在同一实训基地，通过实践课形式考核，前置培训资源，并以贡献抵消培训成本，作为筛选机制。
  name: 实训式选拔机制
  source: 整个体系的核心设计思想是，把课堂和招聘同时放在同一个实训基地去进行整合。……面试考核用实践课资料考核，试用期考核用生产实习考核；前置培训，培训资源计价，贡献超出培训才通过；合同统一为实训合同。
- description: 招聘标准应不低于现有人员水平，可慢慢挑选合适人选。
  name: 招聘标准不低于现有人员
  source: 招聘标准不低于现有人员，可以慢慢挑选。
- description: 在招聘中作为甲方，应关注自身需求而非候选人需求。
  name: 招聘主体立场原则
  source: 就是我们在招聘上是甲方，我们应该考虑我们需要什么，而不是他们需要什么。
- description: 招聘需有明确的工作章程，以白纸黑字与招聘者约定考核方式。
  name: 招聘章程明确原则
  source: 还有就是要确定新的那个招聘的工作章程，就是我们要有明确的白纸黑字跟那个招聘者去约定我们怎么考核。
- description: 通过微型创业模式进行考核，提供资源和场域，让候选人自由选择个人或组队解决真实业务问题，以结果和行为作为录用依据。
  name: 新考核方案微型创业模式
  source: 我们在完成初步邮件调研选拔后，将剩下的人放入实训基地进行不超过两周的考核，采取微型创业模式。……我们提供所有背景资料和工作意图，让他们自由选择个人或组队，我们看结果和过程，保留自由裁量权否定不良行为。
summary: 招聘政策方向为将课堂与招聘整合，通过实训式选拔、结构化调研问卷和微型创业考核等方式，前置筛选、统一管理，并强调以甲方立场明确标准、章程，同时保留招聘渠道但逐步让位于课堂。
